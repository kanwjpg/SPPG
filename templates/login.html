{% extends 'base.html' %}
{% block title %}Login - SPPG Manager{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-egg-fried display-4 text-success"></i>
          <h4 class="mt-2 fw-bold">SPPG Manager</h4>
          <p class="text-muted small">Sistem Manajemen Operasional SPPG - Program MBG</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Masuk</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">Demo: admin / sppg2026</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
