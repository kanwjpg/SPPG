{% extends 'base.html' %}
{% block title %}Tambah Bahan Baku{% endblock %}
{% block content %}
<h3 class="fw-bold mb-3">Tambah Bahan Baku</h3>
<form method="POST" class="card shadow-sm p-4" style="max-width:500px">
  <div class="mb-3">
    <label class="form-label">Nama Bahan</label>
    <input type="text" name="nama" class="form-control" required placeholder="Contoh: Beras">
  </div>
  <div class="mb-3">
    <label class="form-label">Satuan</label>
    <select name="satuan" class="form-select">
      <option value="kg">kg</option>
      <option value="liter">liter</option>
      <option value="butir">butir</option>
      <option value="pcs">pcs</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Stok Awal</label>
    <input type="number" step="0.1" name="stok_awal" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Stok Minimum (batas peringatan)</label>
    <input type="number" step="0.1" name="stok_minimum" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary">Simpan</button>
  <a href="{{ url_for('stok_list') }}" class="btn btn-outline-secondary">Batal</a>
</form>
{% endblock %}
