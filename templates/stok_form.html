{% extends 'base.html' %}
{% block title %}Tambah Bahan — SPPG Manager{% endblock %}{% block page_name %}Tambah Bahan{% endblock %}
{% block content %}
<div class="page-head reveal"><div><span class="section-kicker">Inventory</span><h1>Tambah bahan baku</h1><p>Masukkan stok awal dan batas minimum untuk peringatan.</p></div></div>
<form method="POST" class="surface-card form-card narrow reveal"><div class="form-grid single"><label>Nama bahan<input type="text" name="nama" required placeholder="Contoh: Beras"></label><label>Satuan<select name="satuan"><option value="kg">kg</option><option value="liter">liter</option><option value="butir">butir</option><option value="pcs">pcs</option></select></label><label>Stok awal<input type="number" step="0.1" min="0" name="stok_awal" required placeholder="0"></label><label>Stok minimum<input type="number" step="0.1" min="0" name="stok_minimum" required placeholder="Batas peringatan"></label></div><div class="form-actions"><a href="{{ url_for('stok_list') }}" class="btn btn-ghost">Batal</a><button class="btn btn-lime"><i class="bi bi-check2"></i> Simpan bahan</button></div></form>
{% endblock %}
