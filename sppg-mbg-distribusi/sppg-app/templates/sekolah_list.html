{% extends 'base.html' %}
{% block title %}Sekolah - SPPG Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="fw-bold mb-0">Sekolah Penerima</h3>
  <a href="{{ url_for('sekolah_tambah') }}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Tambah Sekolah</a>
</div>
<div class="table-responsive">
<table class="table table-hover bg-white shadow-sm rounded">
  <thead><tr><th>Nama Sekolah</th><th>Jumlah Siswa</th></tr></thead>
  <tbody>
    {% for s in sekolahs %}
    <tr><td>{{ s.nama }}</td><td>{{ s.jumlah_siswa }}</td></tr>
    {% else %}
    <tr><td colspan="2" class="text-center text-muted py-4">Belum ada sekolah terdaftar.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
