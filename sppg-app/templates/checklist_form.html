{% extends 'base.html' %}
{% block title %}Checklist - {{ menu.nama_menu }}{% endblock %}
{% block content %}
<h3 class="fw-bold mb-1">Checklist Keamanan Pangan</h3>
<p class="text-muted">Menu: <strong>{{ menu.nama_menu }}</strong> &middot; {{ menu.tanggal.strftime('%d-%m-%Y') }}</p>

<form method="POST" class="card shadow-sm p-4" style="max-width:600px">
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" name="suhu_ok" id="suhu_ok" {{ 'checked' if checklist.suhu_ok }}>
    <label class="form-check-label" for="suhu_ok">Suhu penyimpanan &amp; penyajian sesuai standar (makanan panas &ge;60&deg;C / dingin &le;4&deg;C)</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" name="sampel_disimpan" id="sampel_disimpan" {{ 'checked' if checklist.sampel_disimpan }}>
    <label class="form-check-label" for="sampel_disimpan">Sampel makanan disimpan minimal 24 jam (untuk investigasi jika ada keluhan)</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" name="waktu_saji_ok" id="waktu_saji_ok" {{ 'checked' if checklist.waktu_saji_ok }}>
    <label class="form-check-label" for="waktu_saji_ok">Makanan disajikan dalam batas waktu aman sejak dimasak (maks. 4 jam)</label>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="kebersihan_ok" id="kebersihan_ok" {{ 'checked' if checklist.kebersihan_ok }}>
    <label class="form-check-label" for="kebersihan_ok">Kebersihan peralatan masak &amp; wadah distribusi terverifikasi</label>
  </div>
  <div class="mb-3">
    <label class="form-label">Petugas Pemeriksa</label>
    <input type="text" name="petugas" class="form-control" value="{{ checklist.petugas or '' }}" required>
  </div>
  <button type="submit" class="btn btn-warning"><i class="bi bi-shield-check"></i> Simpan Checklist</button>
  <a href="{{ url_for('checklist_list') }}" class="btn btn-outline-secondary">Batal</a>
</form>
{% endblock %}
