{% extends 'base.html' %}
{% block title %}Login - SPPG Manager{% endblock %}
{% block content %}
<div class="login-wrap d-flex align-items-center justify-content-center min-vh-100">
  <div class="row justify-content-center w-100 mx-0">
    <div class="col-11 col-sm-6 col-md-4">
      <div class="card login-card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="brand-mark d-inline-flex mb-3" style="width:52px;height:52px;font-size:1.5rem;"><i class="bi bi-egg-fried"></i></span>
            <h4 class="mb-1">SPPG Manager</h4>
            <p class="text-muted small mb-0">Sistem Manajemen Operasional SPPG &mdash; Program MBG</p>
          </div>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Masuk</button>
          </form>
          <p class="text-center text-muted small mt-3 mb-0">Demo: admin / sppg2026</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
