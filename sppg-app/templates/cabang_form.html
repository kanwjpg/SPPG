{% extends 'base.html' %}
{% block title %}Tambah Cabang - SPPG Manager{% endblock %}
{% block content %}

<span class="eyebrow">Jaringan Dapur</span>
<div class="section-header">
  <h3 class="mb-0">Tambah Cabang</h3>
  <a href="{{ url_for('cabang_list') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Kembali</a>
</div>

<div class="card border-0">
  <div class="card-body">
    <form method="POST" class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Nama cabang</label>
        <input type="text" name="nama" class="form-control" placeholder="Contoh: SPPG Purwodadi Kota" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Kode cabang</label>
        <input type="text" name="kode" class="form-control text-uppercase" placeholder="PWD-01" required>
        <div class="form-text">Dipakai sebagai label singkat di jadwal distribusi.</div>
      </div>
      <div class="col-12">
        <label class="form-label">Alamat</label>
        <input type="text" name="alamat" class="form-control" placeholder="Jalan, kelurahan, kecamatan">
      </div>
      <div class="col-md-4">
        <label class="form-label">Kapasitas dapur (porsi/hari)</label>
        <input type="number" name="kapasitas_porsi" class="form-control" min="0" placeholder="1000">
      </div>
      <div class="col-md-4">
        <label class="form-label">Kepala dapur</label>
        <input type="text" name="kepala" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label">Telepon</label>
        <input type="text" name="telepon" class="form-control" placeholder="0812-xxxx-xxxx">
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-success"><i class="bi bi-check2"></i> Simpan Cabang</button>
        <a href="{{ url_for('cabang_list') }}" class="btn btn-outline-secondary">Batal</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
